<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نظام التعبئة الذكي</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230a1f44'/%3E%3Cg fill='none' stroke='white' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M16 50V16a4 4 0 0 1 4-4h16a4 4 0 0 1 4 4v34'/%3E%3Cpath d='M12 50h32'/%3E%3Cpath d='M22 24h12'/%3E%3Cpath d='M40 30h4a4 4 0 0 1 4 4v8a3 3 0 0 0 6 0V24l-6-6'/%3E%3C/g%3E%3C/svg%3E">
<style>
  :root {
    --navy-950: #061429;
    --navy-900: #0a1f44;
    --navy-800: #0f2b5b;
    --navy-700: #17408a;
    --navy-100: #e6ecf6;
    --navy-50:  #f4f7fb;
    --ink:      #0a1f44;
    --muted:    #5b6b86;
    --line:     #dde4ef;
    --accent:   #94a3b8;           /* لون الحالة الحالية (يتغير من JS) */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; }
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: #fff; color: var(--ink);
    display: flex; flex-direction: column; min-height: 100vh;
  }
  svg { display: block; }

  /* ================= الترويسة ================= */
  .topbar {
    background: var(--navy-950);
    color: #fff;
    padding: 14px 5vw;
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid rgba(255,255,255,.08);
  }
  .brand { display: flex; align-items: center; gap: 14px; }
  .brand .mark {
    width: 40px; height: 40px; border-radius: 10px;
    background: #fff; color: var(--navy-900);
    display: grid; place-items: center;
  }
  .brand .name  { font-size: 18px; font-weight: 800; letter-spacing: .2px; }
  .brand .tagline { font-size: 12px; opacity: .6; margin-top: 2px; }
  .top-right { display: flex; align-items: center; gap: 26px; font-size: 14px; }
  .clock {
    position: absolute; z-index: 2; top: 16px; left: 5vw;
    font-variant-numeric: tabular-nums; font-weight: 700; font-size: 20px;
    direction: ltr; color: #fff; opacity: .9;
  }
  .live { display: flex; align-items: center; gap: 8px; padding: 6px 14px; border-radius: 999px;
          background: rgba(255,255,255,.08); font-size: 13px; font-weight: 600; }
  .live i { width: 8px; height: 8px; border-radius: 50%; background: #4ade80; animation: blink 1.4s infinite; }
  @keyframes blink { 50% { opacity: .25; } }

  /* ================= لوحة الحالة ================= */
  .hero {
    position: relative; overflow: hidden;
    background: linear-gradient(135deg, var(--navy-900) 0%, var(--navy-700) 100%);
    color: #fff;
    padding: 44px 5vw 48px;
  }
  .hero::before, .hero::after {
    content: ""; position: absolute; border-radius: 50%;
    background: rgba(255,255,255,.04);
  }
  .hero::before { width: 420px; height: 420px; left: -120px; top: -180px; }
  .hero::after  { width: 300px; height: 300px; left: 160px; bottom: -190px; }

  .hero-inner {
    position: relative; z-index: 1;
    max-width: 1200px; margin: 0 auto;
    display: flex; align-items: center; gap: 30px;
  }
  .status-ico {
    width: 96px; height: 96px; border-radius: 50%; flex-shrink: 0;
    background: #fff; color: var(--navy-900);
    display: grid; place-items: center;
    box-shadow: 0 0 0 8px rgba(255,255,255,.12), 0 0 0 0 var(--accent);
    position: relative;
  }
  .status-ico::after {
    content: ""; position: absolute; inset: -8px; border-radius: 50%;
    border: 3px solid var(--accent);
  }
  .live-state .status-ico { animation: ring 1.6s infinite; }
  @keyframes ring {
    0%   { box-shadow: 0 0 0 8px rgba(255,255,255,.12), 0 0 0 8px rgba(255,255,255,.25); }
    100% { box-shadow: 0 0 0 8px rgba(255,255,255,.12), 0 0 0 26px rgba(255,255,255,0); }
  }
  .status-chip {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 5px 14px; border-radius: 999px;
    background: rgba(255,255,255,.1); font-size: 13px; font-weight: 700;
    margin-bottom: 12px;
  }
  .status-chip i { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); }
  .status-title { font-size: 36px; font-weight: 800; line-height: 1.25; }
  .status-sub   { font-size: 18px; margin-top: 8px; opacity: .8; font-weight: 500; }

  .timer { height: 4px; background: var(--navy-100); }
  .timer > div { height: 100%; width: 0; background: var(--navy-700); }
  .timer.run > div { width: 100%; animation: shrink 10s linear forwards; }
  @keyframes shrink { from { width: 100%; } to { width: 0; } }

  /* ================= البيانات ================= */
  main { flex: 1; width: 100%; max-width: 1200px; margin: 0 auto; padding: 34px 5vw 50px; }
  .section-title {
    display: flex; align-items: center; gap: 12px;
    font-size: 15px; font-weight: 800; color: var(--navy-800);
    text-transform: uppercase; letter-spacing: .3px; margin-bottom: 6px;
  }
  .section-title::after { content: ""; flex: 1; height: 1px; background: var(--line); }

  .data { display: grid; grid-template-columns: repeat(3, 1fr); column-gap: 44px; }
  .item { display: flex; gap: 16px; align-items: flex-start; padding: 24px 0; border-bottom: 1px solid var(--line); }
  .item .ico {
    width: 44px; height: 44px; border-radius: 12px; flex-shrink: 0;
    background: var(--navy-50); color: var(--navy-700);
    border: 1px solid var(--navy-100);
    display: grid; place-items: center;
  }
  .item .label { font-size: 13px; color: var(--muted); font-weight: 700; margin-bottom: 6px; }
  .item .value { font-size: 24px; font-weight: 800; color: var(--navy-900); word-break: break-word; min-height: 34px; }
  .empty { color: #c3cddd !important; }

  .plate {
    display: inline-block; direction: ltr;
    background: #fff; color: var(--navy-900);
    border: 3px solid var(--navy-900); border-radius: 10px;
    padding: 0 16px; letter-spacing: 2px; font-weight: 800;
    box-shadow: inset 0 0 0 2px #fff, inset 0 0 0 3px var(--navy-100);
  }
  .tag { display: inline-block; padding: 1px 18px; border-radius: 999px; font-size: 20px; font-weight: 800; }
  .tag.diesel { background: var(--navy-900); color: #fff; }
  .tag.petrol { background: #fff; color: var(--navy-900); border: 2px solid var(--navy-900); }
  .tag.other  { padding: 0; }

  /* ================= الملاحظات ================= */
  .notes {
    margin-top: 34px;
    background: var(--navy-50);
    border: 1px solid var(--navy-100);
    border-right: 8px solid var(--accent);
    border-radius: 6px 14px 14px 6px;
    padding: 22px 28px;
    display: flex; align-items: center; justify-content: space-between; gap: 24px; flex-wrap: wrap;
  }
  .notes .n-label { font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 6px; }
  .notes .n-text  { font-size: 24px; font-weight: 800; line-height: 1.6; color: var(--navy-900); }
  .notes.idle .n-text { font-size: 19px; font-weight: 600; color: #8a98b3; }
  .next {
    background: var(--navy-900); color: #fff;
    border-radius: 12px; padding: 12px 22px; text-align: center;
  }
  .next small { display: block; font-size: 12px; opacity: .7; margin-bottom: 4px; }
  .next b { font-size: 21px; }

  .hidden { display: none !important; }

  footer { background: var(--navy-950); color: rgba(255,255,255,.55); text-align: center; font-size: 12px; padding: 14px; }

  @media (max-width: 860px) {
    .data { grid-template-columns: repeat(2, 1fr); column-gap: 24px; }
    .status-title { font-size: 26px; } .status-ico { width: 74px; height: 74px; }
  }
  @media (max-width: 540px) {
    .data { grid-template-columns: 1fr; }
    .hero-inner { flex-direction: column; text-align: center; }
  }
</style>
</head>
<body>

  <!-- لوحة الحالة -->
  <section id="hero" class="hero">
    <div id="clock" class="clock">--:--:--</div>
    <div class="hero-inner">
      <div id="status-ico" class="status-ico"></div>
      <div>
        <div class="status-chip"><i></i><span id="chip-text">وضع الاستعداد</span></div>
        <div id="b-title" class="status-title">في انتظار مسح رمز QR</div>
        <div id="b-sub" class="status-sub">يرجى تقريب الرمز من الماسح الضوئي</div>
      </div>
    </div>
  </section>
  <div id="timer" class="timer"><div></div></div>

  <main>
    <div class="section-title">بيانات المركبة والمستفيد</div>
    <div class="data">
      <div class="item">
        <div class="ico"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></div>
        <div><div class="label">الاسم</div><div id="v-name" class="value empty">—</div></div>
      </div>
      <div class="item">
        <div class="ico"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg></div>
        <div><div class="label">رقم الهاتف</div><div id="v-phone" class="value empty" style="direction:ltr;text-align:right">—</div></div>
      </div>
      <div class="item">
        <div class="ico"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 17h14M3 13l2-6a2 2 0 0 1 1.9-1.4h10.2A2 2 0 0 1 19 7l2 6v4a1 1 0 0 1-1 1h-1a2 2 0 0 1-4 0H9a2 2 0 0 1-4 0H4a1 1 0 0 1-1-1z"/><path d="M3 13h18"/></svg></div>
        <div><div class="label">رقم لوحة السيارة</div><div class="value"><span id="v-plate" class="empty">—</span></div></div>
      </div>
      <div class="item">
        <div class="ico"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.7S5 10 5 15a7 7 0 0 0 14 0c0-5-7-12.3-7-12.3z"/></svg></div>
        <div><div class="label">نوع الوقود</div><div class="value"><span id="v-fuel" class="tag other empty">—</span></div></div>
      </div>
      <div class="item">
        <div class="ico"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L2 12V2h10l8.6 8.6a2 2 0 0 1 0 2.8z"/><circle cx="7" cy="7" r="1.2"/></svg></div>
        <div><div class="label">نوع الاستعمال</div><div id="v-usage" class="value empty">—</div></div>
      </div>
      <div class="item">
        <div class="ico"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg></div>
        <div><div class="label">تاريخ آخر تعبئة</div><div id="v-last" class="value empty">—</div></div>
      </div>
    </div>

    <div id="notes" class="notes idle">
      <div>
        <div class="n-label">ملاحظات</div>
        <div id="notes-text" class="n-text">ستظهر الملاحظات هنا بعد مسح الرمز</div>
      </div>
      <div id="notes-next" class="next hidden">
        <small>موعد التعبئة القادمة</small>
        <b id="v-next">—</b>
      </div>
    </div>
  </main>

  <footer>نظام التعبئة الذكي &copy; <span id="yr"></span></footer>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<script>
  const firebaseConfig = {
    apiKey:      "AIzaSyB4nsX2f4oefdTi45__g2XJc-qEuc_f9HE",
    projectId:   "appfuel-f5c30",
    databaseURL: "https://appfuel-f5c30-default-rtdb.firebaseio.com"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  const $ = (id) => document.getElementById(id);
  const hero = $('hero'), notes = $('notes'), timer = $('timer');
  let resetTimeout = null;

  /* ساعة وسنة */
  $('yr').innerText = new Date().getFullYear();
  setInterval(() => { $('clock').innerText = new Date().toLocaleTimeString('en-GB'); }, 1000);
  $('clock').innerText = new Date().toLocaleTimeString('en-GB');

  /* أيقونات الحالة */
  const S = (p) => `<svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
  const ICONS = {
    waiting:    S('<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'),
    approved:   S('<path d="M20 6 9 17l-5-5"/>'),
    rejected:   S('<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'),
    wrong_fuel: S('<path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/>'),
    inactive:   S('<circle cx="12" cy="12" r="9"/><path d="m15 9-6 6M9 9l6 6"/>')
  };
  const ACCENT = { waiting: '#94a3b8', approved: '#22c55e', rejected: '#f59e0b', wrong_fuel: '#f97316', inactive: '#ef4444' };
  const CHIP = { waiting: 'وضع الاستعداد', approved: 'مقبولة', rejected: 'مرفوضة', wrong_fuel: 'وقود غير مطابق', inactive: 'مرفوضة' };

  const pick = (d, keys) => {
    for (const k of keys) if (d[k] !== undefined && d[k] !== null && String(d[k]).trim() !== '') return d[k];
    return '';
  };

  function fmtDate(v) {
    if (!v) return '—';
    let d;
    if (typeof v.toDate === 'function') d = v.toDate();
    else if (typeof v === 'number') d = new Date(v);
    else { d = new Date(v); if (isNaN(d)) return String(v); }
    if (isNaN(d)) return '—';
    return d.toLocaleDateString('ar-LY-u-nu-latn', { year: 'numeric', month: 'long', day: 'numeric' });
  }

  function fuelKind(v) {
    const s = String(v || '').toLowerCase();
    if (/diesel|ديزل|سولار|gasoil/.test(s)) return 'diesel';
    if (/petrol|gasoline|benzin|بنزين/.test(s)) return 'petrol';
    return 'other';
  }
  const fuelLabel = { diesel: 'ديزل', petrol: 'بنزين' };

  function setText(id, val) {
    const el = $(id);
    el.innerText = val || '—';
    el.classList.toggle('empty', !val);
  }

  function setState(key, title, sub) {
    const c = ACCENT[key];
    document.documentElement.style.setProperty('--accent', c);
    $('status-ico').innerHTML = ICONS[key];
    $('chip-text').innerText = CHIP[key];
    $('b-title').innerText = title;
    $('b-sub').innerText = sub;
    hero.classList.toggle('live-state', key !== 'waiting');
  }

  function setNotes(text, nextDate) {
    notes.classList.remove('idle');
    $('notes-text').innerText = text;
    if (nextDate) { $('v-next').innerText = nextDate; $('notes-next').classList.remove('hidden'); }
    else $('notes-next').classList.add('hidden');
  }

  function resetFields() {
    ['v-name', 'v-phone', 'v-usage', 'v-last'].forEach(id => setText(id, ''));
    const p = $('v-plate'); p.className = 'empty'; p.innerText = '—';
    const f = $('v-fuel'); f.className = 'tag other empty'; f.innerText = '—';
    notes.classList.add('idle');
    $('notes-text').innerText = 'ستظهر الملاحظات هنا بعد مسح الرمز';
    $('notes-next').classList.add('hidden');
  }

  function showIdle() {
    setState('waiting', 'في انتظار مسح رمز QR', 'يرجى تقريب الرمز من الماسح الضوئي');
    resetFields();
    timer.classList.remove('run');
  }

  function fillDetails(d) {
    const name  = pick(d, ['owner_name', 'ownerName', 'name', 'full_name', 'driver_name', 'customer_name']);
    const phone = pick(d, ['phone', 'phone_number', 'owner_phone', 'ownerPhone', 'mobile']);
    const plate = pick(d, ['car_plate', 'plate', 'plate_number', 'carNumber']);
    const fuel  = pick(d, ['fuel_type', 'fuelType', 'car_fuel_type', 'carFuelType', 'fuel']);
    const usage = pick(d, ['usage_type', 'usageType', 'usage', 'car_usage', 'carUsage', 'use_type']);
    const last  = pick(d, ['last_fill_date', 'lastFillDate', 'last_fueling_date', 'lastFuelingDate', 'last_fill', 'last_fuel_date', 'lastFuelDate', 'last_refuel', 'lastRefuel']);

    setText('v-name', name);
    setText('v-phone', phone);
    setText('v-usage', usage);
    const lastTxt = fmtDate(last);
    if (lastTxt === '—' && d.__new_car) setText('v-last', 'سيارة جديدة — لا توجد تعبئة سابقة');
    else setText('v-last', lastTxt === '—' ? '' : lastTxt);

    const p = $('v-plate');
    p.className = plate ? 'plate' : 'empty';
    p.innerText = plate || '—';

    const k = fuelKind(fuel);
    const f = $('v-fuel');
    f.className = 'tag ' + (fuel ? k : 'other empty');
    f.innerText = fuelLabel[k] || fuel || '—';
    return k;
  }

  /* =====================================================
     جلب بيانات السيارة والمالك من قاعدة البيانات
     (لأن مستند live_status قد لا يحتوي نوع الوقود والاستعمال)
  ===================================================== */
  const norm = (v) => String(v || '').replace(/[\s\-_]/g, '').toLowerCase();
  const carCache = {};

  async function lookupCar(plate) {
    const key = norm(plate);
    if (!key) return null;
    if (carCache[key] && Date.now() - carCache[key].t < 5000) return carCache[key].v;

    let found = null;

    /* المحاولة 1: بحث مباشر بكل السيارات */
    try {
      const q = await db.collectionGroup('cars').where('plate', '==', plate).limit(1).get();
      if (!q.empty) {
        const carDoc = q.docs[0];
        const userDoc = await carDoc.ref.parent.parent.get();
        found = { car: carDoc.data(), user: userDoc.exists ? userDoc.data() : {} };
      }
    } catch (e) { /* قد يحتاج فهرسًا - ننتقل للمحاولة 2 */ }

    /* المحاولة 2: المرور على المستخدمين */
    if (!found) {
      try {
        const users = await db.collection('users').get();
        for (const u of users.docs) {
          const cars = await u.ref.collection('cars').get();
          const hit = cars.docs.find(c => {
            const x = c.data();
            return norm(x.plate || x.carNumber) === key || (x.qrCode && norm(x.qrCode) === key);
          });
          if (hit) { found = { car: hit.data(), user: u.data() }; break; }
        }
      } catch (e) { console.error('خطأ في جلب بيانات السيارة:', e); }
    }

    if (found) {
      const hasLast = pick(found.car, ['lastFillDate', 'last_fill_date', 'lastFuelDate', 'lastFillAt', 'last_fill_at']);
      if (hasLast) { found.lastFill = hasLast; found.isNew = false; }
      else {
        const r = await lookupLastFill(found.car.plate || found.car.carNumber || plate);
        found.lastFill = r.date; found.isNew = r.isNew;
      }
    }

    carCache[key] = { t: Date.now(), v: found };
    return found;
  }

  /* دمج: بيانات قاعدة البيانات (users/cars) لها الأولوية،
     و live_status يُستخدم فقط كإشارة "تم مسح رمز" + قرار الحالة + رقم اللوحة */
  function mergeData(live, db_) {
    if (!db_) return live;
    const c = db_.car || {}, u = db_.user || {};
    const m = { ...live };
    const set = (keys, val) => {
      if (val === undefined || val === null || String(val).trim() === '') return;
      keys.forEach(k => { delete m[k]; });       /* نحذف قيم live القديمة بكل أسمائها */
      m[keys[0]] = val;
    };
    set(['owner_name', 'ownerName', 'name', 'full_name', 'driver_name', 'customer_name'], pick(u, ['name', 'full_name']));
    set(['phone', 'phone_number', 'owner_phone', 'ownerPhone', 'mobile'], pick(u, ['phone']));
    set(['car_plate'], pick(c, ['plate', 'carNumber']) || live.car_plate);
    set(['fuel_type', 'fuelType', 'car_fuel_type', 'carFuelType', 'fuel'], pick(c, ['fuel', 'fuelType', 'fuel_type']));
    set(['usage_type', 'usageType', 'usage', 'car_usage', 'carUsage', 'use_type'], pick(c, ['usage', 'usageType', 'usage_type']));
    set(['last_fill_date', 'lastFillDate', 'last_fueling_date', 'lastFuelingDate', 'last_fill', 'last_fuel_date', 'lastFuelDate', 'last_refuel', 'lastRefuel'],
        pick(c, ['lastFillDate', 'last_fill_date', 'lastFuelDate', 'lastFillAt', 'last_fill_at']) || db_.lastFill);
    set(['next_fill_date', 'nextFillDate', 'next_allowed_date', 'nextAllowedDate', 'next_fueling_date', 'next_date', 'nextDate'], pick(c, ['nextFillDate', 'next_fill_date']));
    m.__new_car = !!db_.isNew;
    return m;
  }

  /* آخر تعبئة: مستند في scans معرّفه = رقم اللوحة، والتاريخ في الحقل timestamp
     إن لم يوجد المستند فالسيارة جديدة */
  async function lookupLastFill(plate) {
    const id = String(plate || '').trim();
    if (!id) return { date: '', isNew: false };
    const candidates = [...new Set([id, id.toUpperCase(), id.replace(/\s+/g, '')])];
    let queryOk = false;

    for (const docId of candidates) {
      try {
        const snap = await db.collection('scans').doc(docId).get();
        queryOk = true;
        if (snap.exists) {
          const ts = snap.data().timestamp;
          return { date: ts || '', isNew: false };
        }
      } catch (e) { console.error('خطأ في قراءة scans:', e); }
    }
    return { date: '', isNew: queryOk };      /* لا مستند = سيارة جديدة */
  }

  /* عرض البيانات والحالة */
  function render(d) {
    const status = (d.verification_status || '').trim().toLowerCase();
    const plate  = d.car_plate || '';
    const carFuel = fillDetails(d);
    const nextDate = fmtDate(pick(d, ['next_fill_date', 'nextFillDate', 'next_allowed_date', 'nextAllowedDate', 'next_fueling_date', 'next_date', 'nextDate']));
    const hasNext  = nextDate !== '—';

    if (status === 'approved') {
      setState('approved', 'تمت الموافقة', 'جاري فتح مضخة الوقود');
      setNotes('يمكنك التعبئة.');
    }
    else if (status === 'rejected') {
      setState('rejected', 'العملية مرفوضة', 'لم تتجاوز الحد المسموح');
      setNotes('لا يمكنك التعبئة الآن، لأنك لم تتجاوز الحد المسموح.', hasNext ? nextDate : '');
    }
    else if (status === 'wrong_fuel') {
      let pump = fuelKind(pick(d, ['pump_fuel', 'pump_fuel_type', 'station_fuel']));
      if (pump === 'other') pump = carFuel === 'diesel' ? 'petrol' : carFuel === 'petrol' ? 'diesel' : 'other';
      const msg = pump === 'diesel' ? 'لا يمكنك التعبئة من هذه المضخة لأنها مخصصة للديزل.'
                : pump === 'petrol' ? 'لا يمكنك التعبئة من هذه المضخة لأنها مخصصة للبنزين.'
                : 'لا يمكنك التعبئة، نوع وقود السيارة غير مطابق لنوع وقود هذه المضخة.';
      setState('wrong_fuel', 'نوع الوقود غير مطابق', 'يرجى التوجه إلى المضخة المناسبة');
      setNotes(msg);
    }
    else if (status === 'inactive' || status === 'invalid_qr') {
      const bad = status === 'invalid_qr' || plate.includes('غير مستخدم');
      setState('inactive', bad ? 'رمز QR غير صالح' : 'سيارة غير نشطة',
               bad ? 'الرمز غير مستخدم أو ناقص البيانات' : 'هذه السيارة محظورة في المنظومة');
      setNotes(bad ? 'لا يمكنك التعبئة: رمز الـ QR غير صالح أو ناقص البيانات.'
                   : 'لا يمكنك التعبئة: هذه السيارة غير نشطة بالمنظومة.');
    }
  }

  /* =====================================================
     الاستماع الحي لحالة التعبئة الحالية
  ===================================================== */
  const RESET_MS = 10000;
  let scanToken = 0;

  db.collection('live_status').doc('current_scan').onSnapshot((snap) => {
    if (resetTimeout) clearTimeout(resetTimeout);
    if (!snap.exists) { scanToken++; showIdle(); return; }

    const live = snap.data();
    const token = ++scanToken;

    /* 1) عرض فوري للحالة + اللوحة فقط (بقية البيانات تأتي من قاعدة البيانات) */
    render({ verification_status: live.verification_status, car_plate: live.car_plate, pump_fuel: live.pump_fuel, pump_fuel_type: live.pump_fuel_type, station_fuel: live.station_fuel });

    /* 2) إكمال الناقص (الوقود، الاستعمال، الاسم...) من قاعدة البيانات */
    const plate = live.car_plate || '';
    const status = (live.verification_status || '').trim().toLowerCase();
    if (plate && status !== 'invalid_qr' && !plate.includes('غير مستخدم')) {
      lookupCar(plate).then((found) => {
        if (token !== scanToken) return;
        render(found ? mergeData(live, found) : live);
      });
    }

    /* 3) شريط العد التنازلي */
    timer.classList.remove('run'); void timer.offsetWidth; timer.classList.add('run');

    /* 4) العودة للانتظار بعد 10 ثوانٍ دون قراءة جديدة */
    resetTimeout = setTimeout(() => {
      scanToken++;
      showIdle();                                   /* تصفير محلي مضمون */
      db.collection('live_status').doc('current_scan').delete()
        .catch((err) => console.error('خطأ التصفير:', err));
    }, RESET_MS);

  }, (err) => console.error('خطأ في جلب البث المباشر:', err));

  showIdle();
</script>
</body>
</html>
